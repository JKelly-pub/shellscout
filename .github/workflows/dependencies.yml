# Reports the Gradle dependency graph to GitHub so Dependabot can raise alerts for the libraries
# ShellScout uses. GitHub can't read Gradle builds from the files alone. This only resolves
# dependencies: it doesn't build or sign the app and has no access to the release key.
name: Dependency graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@v4
